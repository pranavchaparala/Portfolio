<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Editor (Internal) | Pranav Chaparala</title>
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">
    
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="project.css">
    <link rel="stylesheet" href="editor.css">
</head>

<body>

    <div id="editor-gate">
        <form id="gate-form" class="gate-card">
            <h1>Internal Block Editor</h1>
            <p>This page is for content authoring only and isn't linked from the public site.</p>
            <input type="password" id="gate-password" placeholder="Password" autocomplete="off">
            <div class="gate-error" id="gate-error"></div>
            <button type="submit">Unlock</button>
        </form>
    </div>

    <div id="editor-shell" class="hidden">
        <aside id="entity-sidebar">
            <div class="sidebar-tabs">
                <button type="button" data-tab="project" class="active">Projects</button>
                <button type="button" data-tab="experiment">Experiments</button>
            </div>
            <ul class="entity-list" id="entity-list"></ul>
            <button type="button" class="new-draft-btn" id="new-draft-btn">+ New Draft</button>
        </aside>

        <main id="editor-main">
            <div id="editor-toolbar">
                <div class="toolbar-left">
                    <div class="view-toggle">
                        <button type="button" data-view="canvas" class="active">Edit</button>
                        <button type="button" data-view="preview">Preview</button>
                    </div>
                    <span class="editor-state-badge" id="editor-state-badge"></span>
                </div>
                <div class="toolbar-right" style="display:flex; gap:8px;">
                    <button type="button" class="toolbar-btn hidden" id="import-btn" title="Parse this project's live index.html body into editable blocks">Import from Page</button>
                    <button type="button" class="toolbar-btn" id="export-btn">Export</button>
                </div>
            </div>

            <div id="block-canvas"></div>
            <div id="add-block-row" class="add-block-row">
                <select id="add-block-type-select"></select>
                <button type="button" id="add-block-confirm-btn">+ Add block</button>
            </div>

            <div id="preview-pane" class="hidden"></div>
        </main>

        <aside id="meta-sidebar"></aside>
    </div>

    <div id="export-scrim"></div>
    <div id="export-panel">
        <div class="export-panel-head">
            <strong style="font-size:13px;">Export</strong>
            <button type="button" class="toolbar-btn" id="export-close-btn">Close</button>
        </div>
        <div class="export-tabs">
            <button type="button" class="export-tab active" data-tab="js">JS Object</button>
            <button type="button" class="export-tab" data-tab="html">HTML Markup</button>
        </div>
        <div class="export-panel-body">
            <div class="export-tab-content" id="export-tab-js">
                <div class="export-comment">Paste into <code>projects.js</code> (projectsData / experimentsData).</div>
                <textarea id="export-js-output" readonly></textarea>
                <button type="button" class="toolbar-btn export-copy-btn" data-target="export-js-output">Copy</button>
            </div>
            <div class="export-tab-content hidden" id="export-tab-html">
                <div class="export-comment">Paste into the corresponding project's <code>index.html</code> (inside <code>.case-study-container</code>).</div>
                <textarea id="export-html-output" readonly></textarea>
                <button type="button" class="toolbar-btn export-copy-btn" data-target="export-html-output">Copy</button>
            </div>
        </div>
    </div>

    <script src="projects.js"></script>
    <script src="editor.js"></script>
</body>

</html>
