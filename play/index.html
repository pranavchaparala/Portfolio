<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground | Pranav Chaparala</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script defer src="https://cloud.umami.is/script.js"
        data-website-id="ac456770-c586-452f-afe2-117426e32d21"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="playground.css">
</head>

<body class="bg-white">
    <!-- Navigation is injected by components.js -->

    <main class="viewport" id="viewport">
        <div id="grid-wrapper" class="grid-wrapper">
            <div id="grid" class="grid-container">
                <!-- Cards Injected via JS by playground.js -->
            </div>
        </div>
    </main>

    <div id="info-overlay" class="info-overlay">
        <div class="flex items-center justify-center gap-2 mb-2">
            <h2 id="focus-title" class="!text-[0.65rem] !tracking-[0.5em] font-bold uppercase"></h2>
            <button id="focus-mute-status" onclick="window.toggleMute(event)"
                class="!text-[0.5rem] bg-transparent border-0 p-0 cursor-pointer opacity-50 hover:opacity-100 transition-opacity uppercase tracking-widest font-bold pointer-events-auto"></button>
        </div>
        <p id="focus-subtitle" class="!text-[0.55rem] !text-gray-600 !tracking-widest"></p>
        <button onclick="resetView()"
            class="mt-12 !text-[0.5rem] !text-gray-700 hover:!text-black transition-colors pointer-events-auto">
            [ CLICK ANYWHERE TO RETURN ]
        </button>
    </div>

    <!-- Scripts -->
    <script src="../projects.js"></script>
    <script src="../cursor.js"></script>
    <script src="../components.js"></script>
    <script src="playgroundData.js"></script>
    <script src="playground.js"></script>
</body>

</html>
